# Postgres for local development.
#   docker compose up -d db
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beka
    ports:
      - "5432:5432"
    volumes:
      - beka_pgdata:/var/lib/postgresql/data

volumes:
  beka_pgdata:
